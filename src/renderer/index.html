<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Outreach tracker</title>
    <!-- connect-src has no external hosts: the renderer never calls the
         Team Hub API directly. All network traffic goes through the main
         process. ws: is required for Vite hot reload in development. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
